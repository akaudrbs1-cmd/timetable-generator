<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>시간표 생성기</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
body{font-family:system-ui,"Malgun Gothic",sans-serif;margin:16px;color:#222;font-size:14px}
fieldset{margin:0 0 12px;border:1px solid #ccc;border-radius:6px;padding:10px}
legend{font-weight:bold;padding:0 4px}
label{display:inline-block;margin:4px 10px 4px 0}
input[type=text],input[type=date],select{padding:4px}
table{border-collapse:collapse;font-size:12px;margin-top:8px}
td,th{border:1px solid #999;padding:4px 6px;text-align:center;vertical-align:middle;min-width:90px}
th{background:#f3f3f3}
.time{background:#f1dfdb;white-space:nowrap}
.preview{max-height:240px;overflow:auto}
button{padding:6px 12px;margin-top:6px;cursor:pointer}
.msg{color:#b00;margin-top:6px}
</style>
</head>
<body>
<h2>시간표 생성기</h2>

<fieldset>
<legend>1. 기존 시간표 파일 (참고용)</legend>
<input type="file" id="file" accept=".xlsx,.xls">
<div class="preview" id="preview"></div>
</fieldset>

<fieldset>
<legend>2. 수강생 / 담당 멘토</legend>
<label>수강생 이름 <input type="text" id="student"></label><br>
<label>담당 멘토 이름 <input type="text" id="mentor" value="마명균"></label>
<label>연락처 <input type="text" id="phone" value="031-608-5592"></label>
</fieldset>

<fieldset>
<legend>3. 과목 추가</legend>
<label>과목명 <input type="text" id="cname"></label><br>
<label>요일 <select id="dayopt"></select></label>
<label>시간대 <select id="timeopt"></select></label><br>
<label>개강일 <input type="date" id="d1"></label>
<label>종강일 <input type="date" id="d2"></label><br>
<button id="add">추가</button>
<div class="msg" id="msg"></div>
</fieldset>

<fieldset>
<legend>4. 추가된 과목 (여러 개 추가 가능)</legend>
<div id="list"></div>
<button id="clear">전체 삭제</button>
</fieldset>

<fieldset>
<legend>5. 시간표 미리보기 / 저장</legend>
<div id="grid"></div>
<button id="export">엑셀로 저장</button>
<div class="msg" id="exmsg"></div>
</fieldset>

<script>
const DAY_OPTS = {'월화수목':['월','화','수','목'], '화목':['화','목'], '월수':['월','수'], '금':['금'], '토일':['토','일'], '토':['토'], '일':['일']};
const TIME_OPTS = {
  '오전': ['09:00~11:00','10:00~13:00','11:00~13:00'],
  '오후': ['13:00~15:00','13:00~16:00','14:00~16:00','15:00~17:00','16:00~19:00'],
  '저녁': ['18:00~22:00','19:00~22:00']
};

let courses = [];

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function md(iso) { return iso.slice(5,7) + iso.slice(8,10); }
function monthKey(iso) { return iso.slice(0,7); }
function dayLabel(c) { return c.dayLabel; }
function rowKey(c) { return c.t1 + '~' + c.t2 + ' (' + dayLabel(c) + ')'; }

document.getElementById('dayopt').innerHTML = Object.keys(DAY_OPTS).map(k => '<option>' + k + '</option>').join('');
document.getElementById('timeopt').innerHTML = Object.entries(TIME_OPTS).map(([g, arr]) =>
  '<optgroup label="' + g + '">' + arr.map(t => '<option value="' + t + '">' + t + '</option>').join('') + '</optgroup>').join('');

document.getElementById('file').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const wb = XLSX.read(new Uint8Array(r.result), {type: 'array'});
      document.getElementById('preview').innerHTML = wb.SheetNames.map(n =>
        '<h4>' + esc(n) + '</h4>' + XLSX.utils.sheet_to_html(wb.Sheets[n])).join('');
    } catch (err) {
      document.getElementById('preview').textContent = '파일을 읽지 못했습니다.';
    }
  };
  r.readAsArrayBuffer(f);
});

document.getElementById('add').addEventListener('click', () => {
  const msg = document.getElementById('msg');
  const name = document.getElementById('cname').value.trim();
  const dl = document.getElementById('dayopt').value;
  const [t1, t2] = document.getElementById('timeopt').value.split('~');
  const d1 = document.getElementById('d1').value;
  const d2 = document.getElementById('d2').value;
  if (!name || !d1 || !d2) { msg.textContent = '과목명, 개강일, 종강일을 입력해 주세요.'; return; }
  if (d2 < d1) { msg.textContent = '종강일이 개강일보다 빨라서 확인이 필요합니다.'; return; }
  msg.textContent = '';
  courses.push({name, dayLabel: dl, t1, t2, d1, d2});
  document.getElementById('cname').value = '';
  render();
});

document.getElementById('clear').addEventListener('click', () => {
  if (confirm('추가된 과목을 모두 지울까요?')) { courses = []; render(); }
});

document.getElementById('list').addEventListener('click', e => {
  const i = e.target.dataset.del;
  if (i !== undefined) { courses.splice(Number(i), 1); render(); }
});

function render() {
  document.getElementById('list').innerHTML = courses.length ? courses.map((c,i) =>
    '<div>' + esc(c.name) + ' / ' + esc(dayLabel(c)) + ' ' + c.t1 + '~' + c.t2 + ' / ' + c.d1 + '~' + c.d2 +
    ' <button data-del="' + i + '">삭제</button></div>').join('') : '<div>추가된 과목이 없습니다.</div>';

  if (!courses.length) { document.getElementById('grid').innerHTML = ''; return; }
  const keys = [...new Set(courses.map(rowKey))].sort();
  const months = [...new Set(courses.map(c => monthKey(c.d1)))].sort();
  let html = '<table><tr><th>시간</th>' + months.map(m => '<th>' + Number(m.slice(5)) + '월</th>').join('') + '</tr>';
  keys.forEach(k => {
    html += '<tr><td class="time">' + esc(k) + '</td>' + months.map(m => {
      const cs = courses.filter(c => rowKey(c) === k && monthKey(c.d1) === m);
      return '<td>' + cs.map(c => esc(c.name) + '<br>(' + md(c.d1) + '~' + md(c.d2) + ')').join('<br><br>') + '</td>';
    }).join('') + '</tr>';
  });
  html += '</table>';
  document.getElementById('grid').innerHTML = html;
}

document.getElementById('export').addEventListener('click', () => {
  const exmsg = document.getElementById('exmsg');
  try {
    const student = document.getElementById('student').value.trim();
    const mentor = document.getElementById('mentor').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const keys = [...new Set(courses.map(rowKey))].sort();
    const months = [...new Set(courses.map(c => monthKey(c.d1)))].sort();
    const aoa = [
      ['시간표'],
      ['수강생', student, '', '담당멘토', mentor + ' / ' + phone],
      [],
      ['시간', ...months.map(m => Number(m.slice(5)) + '월')]
    ];
    keys.forEach(k => aoa.push([k, ...months.map(m =>
      courses.filter(c => rowKey(c) === k && monthKey(c.d1) === m)
        .map(c => c.name + '\n(' + md(c.d1) + '~' + md(c.d2) + ')').join('\n\n'))]));
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '시간표');
    XLSX.writeFile(wb, (student || '시간표') + '_시간표.xlsx');
    exmsg.textContent = '저장했습니다.';
  } catch (err) {
    exmsg.textContent = '저장에 실패했습니다. 페이지를 새로고침한 뒤 다시 시도해 주세요.';
  }
});

render();
</script>
</body>
</html>
